<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280">
  <style>
    @font-face{font-family:'Departure';font-style:normal;src:url(data:font/woff;base64,) format('woff')}
    .dm{font-family:'Departure',ui-monospace,monospace}
    .rise{animation:rise 1s cubic-bezier(.2,.8,.2,1) both}
    @keyframes rise{from{transform:translateY(110px)}to{transform:translateY(0)}}
    .cur{animation:cur 1s steps(1) infinite}
    @keyframes cur{50%{opacity:0}}
  </style>
  <defs><clipPath id="c"><rect x="0" y="62" width="1200" height="112"/></clipPath></defs>
  <rect width="1200" height="280" fill="#0B0B0B"/>
  <g clip-path="url(#c)">
    <text class="dm rise" x="600" y="150" font-size="96" fill="#F2F0EA" text-anchor="middle">trail<tspan fill="#C8FF2E">.log</tspan><tspan class="cur" fill="#C8FF2E">▮</tspan></text>
  </g>
  <text class="dm" x="600" y="226" font-size="17" fill="#6B6B6B" text-anchor="middle" xml:space="preserve"><tspan fill="#C8FF2E">$</tspan> tail -f trail.log  <tspan fill="#4A4A4A"># seismic activity, measured in commits</tspan></text>
</svg>
